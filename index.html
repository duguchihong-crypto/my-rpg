<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        user-scalable=no">

    <title>我的RPG</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: #000;

            overflow: hidden;
        }


        /* =========================
           游戏封面
        ========================= */

        #cover {

            position: fixed;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            background: #000;

            display: flex;

            align-items: center;
            justify-content: center;

            z-index: 100;
        }


        /* =========================
           封面图片
        ========================= */

        #cover img {

            width: 100%;
            height: 100%;

            object-fit: cover;

            object-position: center;

            display: block;
        }


        /* =========================
           开始按钮
        ========================= */

        #startButton {

            position: absolute;

            left: 50%;
            bottom: 8%;

            transform: translateX(-50%);

            padding: 14px 45px;

            border: 1px solid
                rgba(255,255,255,0.7);

            border-radius: 5px;

            background:
                rgba(0,0,0,0.55);

            color: white;

            font-size: 20px;

            letter-spacing: 4px;

            backdrop-filter: blur(5px);

            cursor: pointer;
        }


        #startButton:active {

            background:
                rgba(120,0,0,0.7);

            transform:
                translateX(-50%)
                scale(0.96);
        }


        /* =========================
           游戏画面
        ========================= */

        #game {

            display: none;

            width: 100vw;
            height: 100vh;

            background: #6ab04c;
        }

    </style>

</head>


<body>


<!-- =========================
     游戏封面
========================= -->

<div id="cover">

    <!-- 你的封面图片 -->

    <img src="IMG_2307.jpeg"
         alt="RPG游戏封面">

    <button id="startButton">
        开始游戏
    </button>

</div>


<!-- =========================
     游戏画面
========================= -->

<canvas id="game"></canvas>


<script>


// ==========================================
// 获取元素
// ==========================================

const cover =
    document.getElementById("cover");

const startButton =
    document.getElementById("startButton");

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");


// ==========================================
// 点击开始游戏
// ==========================================

startButton.addEventListener(
    "click",
    function () {

        cover.style.display = "none";

        canvas.style.display = "block";

        startGame();

    }
);


// ==========================================
// 调整游戏画面大小
// ==========================================

function resize() {

    canvas.width =
        window.innerWidth;

    canvas.height =
        window.innerHeight;

}

window.addEventListener(
    "resize",
    resize
);

resize();


// ==========================================
// 玩家
// ==========================================

const player = {

    x: 150,

    y: 250,

    size: 40,

    speed: 5

};


// ==========================================
// 键盘
// ==========================================

const keys = {

    up: false,

    down: false,

    left: false,

    right: false

};


// ==========================================
// 键盘按下
// ==========================================

document.addEventListener(
    "keydown",
    function(e) {

        if (e.key === "ArrowUp") {

            keys.up = true;

        }

        if (e.key === "ArrowDown") {

            keys.down = true;

        }

        if (e.key === "ArrowLeft") {

            keys.left = true;

        }

        if (e.key === "ArrowRight") {

            keys.right = true;

        }

    }
);


// ==========================================
// 键盘松开
// ==========================================

document.addEventListener(
    "keyup",
    function(e) {

        if (e.key === "ArrowUp") {

            keys.up = false;

        }

        if (e.key === "ArrowDown") {

            keys.down = false;

        }

        if (e.key === "ArrowLeft") {

            keys.left = false;

        }

        if (e.key === "ArrowRight") {

            keys.right = false;

        }

    }
);


// ==========================================
// 游戏更新
// ==========================================

function update() {


    // 上

    if (keys.up) {

        player.y -= player.speed;

    }


    // 下

    if (keys.down) {

        player.y += player.speed;

    }


    // 左

    if (keys.left) {

        player.x -= player.speed;

    }


    // 右

    if (keys.right) {

        player.x += player.speed;

    }


    // 防止玩家走出屏幕

    player.x =
        Math.max(
            0,
            Math.min(
                canvas.width -
                player.size,
                player.x
            )
        );


    player.y =
        Math.max(
            0,
            Math.min(
                canvas.height -
                player.size,
                player.y
            )
        );

}


// ==========================================
// 绘制游戏
// ==========================================

function draw() {


    // ==========================
    // 地面
    // ==========================

    ctx.fillStyle =
        "#6ab04c";

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );


    // ==========================
    // 道路
    // ==========================

    ctx.fillStyle =
        "#d9b382";

    ctx.fillRect(
        0,
        canvas.height / 2 - 50,
        canvas.width,
        100
    );


    // ==========================
    // 玩家
    // ==========================

    ctx.fillStyle =
        "#e74c3c";

    ctx.fillRect(
        player.x,
        player.y,
        player.size,
        player.size
    );

}


// ==========================================
// 游戏循环
// ==========================================

function gameLoop() {

    update();

    draw();

    requestAnimationFrame(
        gameLoop
    );

}


// ==========================================
// 开始游戏
// ==========================================

function startGame() {

    gameLoop();

}

</script>


</body>

</html>
